<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e1f7c6">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>보너스트랙 · 말랑한 마음</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #173f55; background: #e1f7c6; font-family: sans-serif; }
    #letter-app { display: block; border: 0; width: 100%; height: 100vh; height: 100dvh; }
    .loading { padding: 18px; text-align: center; font-size: 14px; }
    .fallback { padding: 14px 20px; text-align: center; font-size: 13px; }
    a { color: inherit; }
  </style>
</head>
<body>
  <p id="loading" class="loading" role="status">보너스트랙을 열고 있어요.</p>
  <iframe id="letter-app" title="말랑한 마음 보너스트랙 편지 작성 및 수신 동의" referrerpolicy="no-referrer"></iframe>
  <p class="fallback">화면이 열리지 않으면 <a id="open-direct" target="_blank" rel="noopener noreferrer">새 창에서 열기</a></p>
  <noscript>보너스트랙을 이용하려면 브라우저에서 자바스크립트를 허용해주세요.</noscript>
  <script>
    const appUrl = new URL('https://script.google.com/macros/s/AKfycbxN8AvIVoTrbKY05k4P9_1LXjvFi52z2htQFAb9DflMPi4oy-uOl96keDniYF7lEqEkzA/exec');
    const invitation = new URLSearchParams(location.search).get('invite');
    if (invitation && /^[a-f0-9]{64}$/.test(invitation)) {
      appUrl.searchParams.set('invite', invitation);
    } else if (location.hash === '#write') {
      appUrl.searchParams.set('view', 'write');
    }
    const app = document.getElementById('letter-app');
    document.getElementById('open-direct').href = appUrl.href;
    app.addEventListener('load', () => {
      document.getElementById('loading').hidden = true;
    });
    app.src = appUrl.href;
  </script>
</body>
</html>
